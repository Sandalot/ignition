name: Transpiler

on:
  push:
    branches:
      - 'main'

defaults:
  run:
    working-directory: .

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      
      - name: Download Butane
        run: |
          wget https://github.com/coreos/butane/releases/latest/download/butane-x86_64-unknown-linux-gnu -O butane
          chmod +x butane

      - name: Transpile
        run: find . -name "*.bu" | while read -r file; do ./butane --strict "$file" > "$(basename "${file%.bu}").ign"; done
      
      - name: Create release
        uses: softprops/action-gh-release@v3
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release
          files: |
            *.ign
